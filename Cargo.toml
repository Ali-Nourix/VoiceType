[package]
name = "voicetype"
version = "0.1.0"
edition = "2021"
description = "A minimal Windows voice typing utility"
license = "GPL-3.0-only"

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
cpal = "0.15"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
global-hotkey = "0.6"
tray-icon = "0.19"
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Security_Cryptography"] }

arabic_reshaper = "0.4"
unicode-bidi = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
